version: '3'
name: devcontainer

services:
  dev-tools:
    image: python:3.8
    volumes:
      - ../:/workspace
      - ~/.ssh:/root/.ssh-host:ro
      - ./python/postStartup.sh:/root/postStartup.sh:ro
    working_dir: /workspace
    command: sleep infinity
    networks: 
      - app-network 

  mysql:
    image: mysql/mysql-server:8.0
    environment:
      MYSQL_ROOT_PASSWORD: cicamica 
      MYSQL_USER: python_user
      MYSQL_PASSWORD: cicamica2
      MYSQL_DATABASE: email_tracker
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes: 
      - ./mysql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ../volumes/mysql:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  
